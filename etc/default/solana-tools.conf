# Welcome to the solana-tools configuration file. Use solana.sh -h
# for more information about this script.

# firedancer version (leave blank to disable)
TAG_FD=

# moniker: mainnet-beta, testnet, devnet
moniker=mainnet-beta

# https://www.kernel.org/doc/Documentation/cpu-freq/governors.txt
# cpu_gov: disabled, conservative, ondemand, userspace, powersave,
# performance, or schedutil.
# By default, the automatic invocation of cpu_tuner is disabled.
cpu_gov=disabled

# Telegram
tg_btoken=
tg_chatid=

# Unstaked pubkeys used for the watchdog notification alerts
# format: xPubkey=Alias

# Hot-swap identity transition over ssh (txtower)
# staked=authorized-voter: if --authorized-voter is not set in the
# systemd unit file, then validator-keypair-MONIKER.json is used;
# ssh_bind: do not edit - it's cached by the getIdentity RPC call;
# ssh_user: must have our ssh key added to ~/.ssh/authorized_keys;
# ssh_tool: if not set, then this script path is assumed to exist;
# failures: the number of consecutive failures needed to fail over;
# cooldown: the number of idle cycles needed to rearm the watchdog;
staked=authorized-voter
unstaked=validator-keypair-junk.json
ssh_bind=
ssh_host=
ssh_port=
ssh_user=
ssh_tool=
failures=1
cooldown=3

# Airdrop & Rebalance
# allow: staked, unstaked, or any if not set
# min: minimum balance on `from` to maintain
# max: maximum balance on `to` to maintain
airdrop_allow=staked
airdrop_from=4ETf86tK7b4W72f27kNLJLgRWi9UfJjgH4koHGUXMFtn
airdrop_to=validator-keypair.json
airdrop_min=1
airdrop_max=10
balance_allow=
balance_from=
balance_to=
balance_min=
balance_max=
balance_step=

# DoubleZero
# dz_fees_allow: staked, unstaked, or any if not set
# dz_fees_epoch_offset: the number of epochs to look back
# dz_fees_epoch_progress: run past epoch progress, or 0 to disable
dz=/usr/bin/doublezero
dz_solana=/usr/bin/doublezero-solana
dz_systemd=doublezerod
dz_keypair=doublezero.json
dz_shred_receiver_address=
dz_up="${dz} connect ibrl"
dz_down="${dz} disconnect"
dz_fees=https://raw.githubusercontent.com/doublezerofoundation/fees/main/epoch/fees_EPOCH.csv
dz_fees_allow=staked
dz_fees_epoch_offset=1
dz_fees_epoch_progress=90
dz_enabled=0

# Overrides
# accounts_db_hash_threads: 1 if snapshots disabled, 2-6 otherwise
# flags [01]
only_known_rpc=
private_rpc=
no_genesis_fetch=1
no_snapshot_fetch=1
no_snapshots=
no_incremental_snapshots=
# options
accounts_db_hash_threads=
snapshot_interval_slots=
full_snapshot_interval_slots=
# jito
commission_bps=
block_engine_url=
relayer_url=
bam_url=
shred_receiver_address=
trust_relayer_packets=
# rakurai
RAA=
rewards_merkle_root_authority=
rakurai_activation_program_id=
reward_distribution_program_id=
banking_packet_delay_ms=
target_slot_adjustment_ms=
client_mode=

# Logging
# log_level: error < warn < info < debug
log_level=info
log_limit=10000
log_period=daily
log_rotate=7

# RPC fallback
# localhost (if up)
# ->rpc_url (if set)
# ->moniker (default)
rpc_url=
rpc_conn_timeout=5
rpc_max_time=10
rpc_retry=5
rpc_retry_delay=1
rpc_retry_max_time=30

# DO NOT EDIT BELOW THIS LINE
cache_ttl=60
free_hugepgs=0
lock_timeout=30
max_delinquent=5
min_idle_time=10
poll_interval=1
relayerd=relayer
systemd=
tower_slot_delay=0
tower_slot_speed=2.5
tower_ttl_slots=256
trim_ttl=$((3600*1))
trim_idle_time=5

# sys-tuner
nofile=1000000
memlock=2000000
udp_buffer=134217728
swappiness=1
cache_pressure=50

# cpu-tuner [01]
cpu_min_to_max=0
cpu_ignore_max=1
cpu_gov_default=schedutil

# setup [01]
# setup_ufw_[ssh,rpc,ws]: allowed IPs separated by comma, 0 to
# deny all, or empty to allow any (avoid locking yourself out)
# setup_cli_full: 1 for agave-watchtower to be installed
setup_sshd=1
setup_ufw=1
setup_ufw_before=0
setup_ufw_ssh=
setup_ufw_rpc=0
setup_ufw_ws=0
setup_f2b=1
setup_sudoers=1
setup_cli=1
setup_cli_full=0
setup_relayer=0
setup_cron=1
setup_bash_aliases=1
setup_snap_finder=0
setup_user=ubuntu
sudoers=sudo

# setup repos
git_anza=https://github.com/anza-xyz/agave.git
git_firedancer=https://github.com/firedancer-io/firedancer.git
git_jito_solana=https://github.com/jito-foundation/jito-solana.git
git_jito_relayer=https://github.com/jito-foundation/jito-relayer.git
git_rakurai=https://github.com/rakurai-io/rakurai-validator.git
git_snap_finder=https://github.com/1dad-io/solana-snapshot-finder.git

# setup URLs
url_doublezero=https://dl.cloudsmith.io/public/malbeclabs/doublezero/setup.deb.sh
url_homebrew=https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
url_anza=https://release.anza.xyz/VERSION/install
url_jito=https://release.jito.wtf/VERSION/install
url_rpc=http://api.${moniker}.solana.com
url_rust=https://sh.rustup.rs

# EOF
